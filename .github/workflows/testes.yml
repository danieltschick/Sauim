name: Testes

on:
  push:
  pull_request:

jobs:
  testes:
    name: Testes (Windows)
    runs-on: windows-latest
    timeout-minutes: 15   # se um diálogo travar um teste, o job não fica preso para sempre
    env:
      QT_QPA_PLATFORM: offscreen   # Qt sem janela de verdade
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Instalar dependências
        run: python -m pip install -r requirements-dev.txt
      - name: Rodar os testes
        run: python -m pytest

  lint:
    name: Análise estática (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install ruff
      - run: ruff check .
